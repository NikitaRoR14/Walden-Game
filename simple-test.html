<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Test</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #1a1a1a; color: #0f0; }
        h1 { color: #0ff; }
    </style>
</head>
<body>
    <h1>✓ HTML is working!</h1>
    <p>If you see this, HTML is parsing correctly.</p>
    <button id="test-btn" onclick="alert('Button works!')">Click Me</button>
    
    <h2>Debug Info:</h2>
    <div id="info"></div>
    
    <script>
        document.getElementById('info').innerHTML = `
            <p>Document ready state: ${document.readyState}</p>
            <p>Body exists: ${!!document.body}</p>
            <p>Test button exists: ${!!document.getElementById('test-btn')}</p>
        `;
    </script>
</body>
</html>
